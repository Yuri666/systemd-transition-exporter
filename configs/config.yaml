server:
  listen: "0.0.0.0:9877"
  # Enables the destructive POST /debug/dbus/disconnect test endpoint.
  debug: false

services:
  - pcscf.service
  - scscf.service
  - icscf.service

systemd:
  reconnect_interval: 1s
  reconciliation_interval: 30s

  # Used only to estimate and expose the potentially uncovered startup gap
  # when no durable event is available. Journal reads remain limited to the
  # current aligned recovery slot.
  startup_recovery_interval: 24h

wal:
  enabled: true
  directory: /var/lib/systemd-transition-exporter/wal
  fsync: true

remote_write:
  enabled: false
  # Every URL has an independent delivery worker, retry state and checkpoint.
  # A failure of one receiver does not delay the others.
  urls:
    - "http://127.0.0.1:9090/api/v1/write"
    # - "http://prometheus-dr:9090/api/v1/write"
  batch_size: 100
  flush_interval: 1s
  retry_interval: 1s
  timeout: 10s
  # Base path. Multi-target checkpoints use a stable URL-hash suffix.
  checkpoint: /var/lib/systemd-transition-exporter/remote_write.checkpoint

  # Current state heartbeat. Keep this comfortably below Prometheus's
  # 5-minute staleness interval; 1m is the recommended default.
  state_interval: 1m

  # Republish the recovered slot at this interval so the series survives the
  # Prometheus lookback delta (5m by default). Allowed range: 10s..4m.
  recovery_fill_interval: 1m

  # Only the current local-time slot is recovered. For example, if the
  # exporter becomes ready at 15:14, the slot 15:00..15:14 is read from the
  # journal and refilled, while earlier closed slots are left untouched.
  # One second before each slot boundary the current state is published
  # in normal operation. Recovery fill does not add this sample.
  recovery_window: 15m

  # Arbitrary constant labels added to every remote_write time series.
  # 'service' and '__name__' are reserved and must not be configured here.
  labels:
    environment: production
    site: test
    role: ims
