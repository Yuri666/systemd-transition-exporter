server:
  listen: "0.0.0.0:9877"

services:
  - pcscf.service
  - scscf.service
  - icscf.service

systemd:
  reconnect_interval: 1s
  reconciliation_interval: 30s

  # If the WAL contains history, startup recovery begins at the oldest
  # durable event. If the WAL is empty, recover this much journal history.
  startup_recovery_interval: 24h

wal:
  enabled: true
  directory: /var/lib/systemd-transition-exporter/wal
  fsync: true

remote_write:
  enabled: false
  url: "http://127.0.0.1:9090/api/v1/write"
  batch_size: 100
  flush_interval: 1s
  retry_interval: 1s
  timeout: 10s
  checkpoint: /var/lib/systemd-transition-exporter/remote_write.checkpoint

  # Current state heartbeat. Keep this comfortably below Prometheus's
  # 5-minute staleness interval; 1m is the recommended default.
  state_interval: 1m

  # Arbitrary constant labels added to every remote_write time series.
  # 'service' and '__name__' are reserved and must not be configured here.
  labels:
    environment: production
    site: test
    role: ims
