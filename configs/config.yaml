server:
  listen: "0.0.0.0:9877"
  # Enables the destructive POST /debug/dbus/disconnect test endpoint.
  debug: false

services:
  - pcscf.service
  - scscf.service
  - icscf.service

systemd:
  reconnect_interval: 1s
  reconciliation_interval: 30s

  # Used only to estimate and expose the potentially uncovered startup gap
  # when no durable event is available. Journal reads remain limited to the
  # current aligned recovery slot.
  startup_recovery_interval: 24h

wal:
  enabled: true
  directory: /var/lib/systemd-transition-exporter/wal
  fsync: true

remote_write:
  enabled: false
  url: "http://127.0.0.1:9090/api/v1/write"
  batch_size: 100
  flush_interval: 1s
  retry_interval: 1s
  timeout: 10s
  checkpoint: /var/lib/systemd-transition-exporter/remote_write.checkpoint

  # Current state heartbeat. Keep this comfortably below Prometheus's
  # 5-minute staleness interval; 1m is the recommended default.
  state_interval: 1m

  # Only the current local-time slot is recovered. For example, if the
  # exporter becomes ready at 15:14, journal events are read from 15:00
  # through 15:14 and earlier closed slots are deliberately left untouched.
  recovery_window: 15m

  # Arbitrary constant labels added to every remote_write time series.
  # 'service' and '__name__' are reserved and must not be configured here.
  labels:
    environment: production
    site: test
    role: ims
